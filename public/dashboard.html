<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <a href="/logout" class="logout-btn logout-btn-top">Logout</a>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📝</div>
                <h2>Admin Menu</h2>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="#" id="menu-artikel"><span>📄</span> Artikel</a></li>
                <!-- Menu lain bisa ditambah di sini -->
                <!-- <li><a href="#"><span>📊</span> Statistik</a></li> -->
            </ul>
        </aside>
        <main class="main-content">
            <h2>Daftar Artikel</h2>
            <button id="btn-tambah-artikel" class="btn-tambah">+ Tambah Artikel</button>
            <div id="artikel-list"></div>
        </main>
    </div>
    <script src="js/artikel.js"></script>
    <script>
        document.getElementById('menu-artikel').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('.main-content h2').textContent = 'Daftar Artikel';
            tampilkanArtikel();
        });
        document.getElementById('btn-tambah-artikel').addEventListener('click', function() {
            window.location.href = 'tambah-artikel.html';
        });
        tampilkanArtikel();
    </script>
</body>
</html>
